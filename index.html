<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#171320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ficha Polia">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Ficha · Polia</title>
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:600 800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400 600;font-style:normal;font-display:swap;src:url(fonts/inter.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 700;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono.woff2) format('woff2')}

:root{
  --ink:#171320;
  --surface:#211B2D;
  --surface-2:#2A2239;
  --line:#372C48;
  --bone:#F4EFE6;
  --muted:#9A8CAC;
  --amber:#F0A93B;
  --amber-dim:#7A5620;
  --win:#5FD3A6;
  --hot:#FF5C8A;
  --disp:'Big Shoulders Display',Impact,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--bone);font-family:var(--body);
  font-size:15px;line-height:1.5;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:var(--mono)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(23,19,32,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0 9px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:var(--disp);font-size:27px;font-weight:800;letter-spacing:.055em;line-height:1}
.brand span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.16em}
.wchip{
  font-family:var(--mono);font-size:12px;font-weight:700;border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;color:var(--amber);background:var(--surface);
}

/* ---------- rail ---------- */
.rail{display:flex;gap:5px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.day{
  flex:0 0 auto;font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.1em;
  padding:7px 13px;border-radius:9px;color:var(--muted);border:1px solid transparent;
  background:var(--surface);transition:.16s;
}
.day.on{background:var(--amber);color:#1A1206}
.day.hoje:not(.on){border-color:var(--amber-dim);color:var(--amber)}
.day.util{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.03em;padding:9px 13px}

/* ---------- day head ---------- */
.dhead{padding:18px 0 6px}
.dhead h1{font-family:var(--disp);font-size:52px;font-weight:800;letter-spacing:.02em;line-height:.88;margin:0}
.dhead p{margin:7px 0 0;color:var(--muted);font-size:13px}
.bar{height:3px;background:var(--line);border-radius:3px;margin:15px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .35s}
.barlbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}

/* ---------- exercise card ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.ex.star{border-color:var(--amber-dim)}
.ex.done{opacity:.55}
.exhead{display:flex;gap:11px;padding:14px;align-items:flex-start;width:100%;text-align:left}
.num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);padding-top:3px;min-width:17px}
.ex.star .num{color:var(--amber)}
.extit{flex:1;min-width:0}
.extit h2{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.tagf{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--hot);border:1px solid var(--hot);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.caret{color:var(--muted);font-size:12px;padding-top:3px;transition:transform .2s}
.ex.open .caret{transform:rotate(180deg)}

.detail{display:none;padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px;padding-top:13px}
.ex.open .detail{display:block}
.dsec{margin-bottom:13px}
.dsec h3{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.17em;color:var(--amber);margin:0 0 6px}
.dsec p{margin:0;font-size:13.5px;color:#D9D1E4}
.dsec ol{margin:0;padding-left:17px;font-size:13.5px;color:#D9D1E4}
.dsec ol li{margin-bottom:5px}
.warn{border-left:2px solid var(--hot);padding-left:10px}
.warn h3{color:var(--hot)}

.btempo{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--amber);margin-bottom:13px;
}

/* ---------- sets ---------- */
.sets{padding:0 14px 12px}
.srow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.slbl{font-family:var(--mono);font-size:11px;color:var(--muted);width:26px;flex:0 0 26px}
.fld{position:relative;flex:1;min-width:0}
.fld input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  color:var(--bone);font-size:16px;font-weight:600;padding:10px 30px 10px 10px;text-align:left;
}
.fld input:focus{outline:2px solid var(--amber);outline-offset:-1px;border-color:transparent}
.fld u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:10px;color:var(--muted);text-decoration:none;pointer-events:none}
.ck{flex:0 0 40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px;color:var(--muted);transition:.15s}
.ck.on{background:var(--amber);border-color:var(--amber);color:#1A1206}
.ghost{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:0 0 8px 34px;letter-spacing:.02em}
.ghost b{color:var(--bone);font-weight:600}
.ghost.beat{color:var(--win)}
.ghost.beat b{color:var(--win)}

/* ---------- rest bar ---------- */
.rest{
  position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .28s;
  background:var(--surface);border-top:1px solid var(--amber-dim);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}
.rest.up{transform:none}
.rin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:13px}
.rt{font-family:var(--disp);font-size:46px;font-weight:800;line-height:.9;color:var(--amber);
  font-variant-numeric:tabular-nums;min-width:104px}
.rmeta{flex:1;min-width:0}
.rmeta b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.rmeta span{font-size:12.5px;color:#D9D1E4;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbtn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.rprog{height:2px;background:var(--line);margin:10px auto 0;max-width:560px;border-radius:2px;overflow:hidden}
.rprog i{display:block;height:100%;background:var(--amber);width:100%}

/* ---------- metronome ---------- */
.met{position:fixed;inset:0;z-index:70;background:var(--ink);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.met.up{display:flex}
.mname{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px;max-width:320px}
.mplan{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:26px}
.ring{position:relative;width:262px;height:262px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.rtrack{stroke:var(--line)}
.rfill{stroke:var(--amber);transition:stroke .2s}
.mphase{font-family:var(--disp);font-size:56px;font-weight:800;letter-spacing:.05em;line-height:1;text-align:center}
.mcount{font-family:var(--mono);font-size:38px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;margin-top:2px}
.mreps{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.18em;margin-top:26px}
.mbtns{display:flex;gap:10px;margin-top:26px}
.mbtn{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.09em;
  border:1px solid var(--line);border-radius:10px;padding:14px 22px;background:var(--surface)}
.mbtn.pri{background:var(--amber);color:#1A1206;border-color:var(--amber)}

/* ---------- guia / histórico ---------- */
.gsec{margin:22px 0}
.gsec>h2{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:.03em;margin:0 0 4px}
.gsec>p{margin:0 0 12px;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
.card.hi{border-color:var(--amber-dim)}
.card h4{margin:0 0 3px;font-size:14px;font-weight:600}
.card h4 em{font-style:normal;color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.1em;margin-right:6px}
.card p{margin:0;font-size:13px;color:#D9D1E4}
.card p.alvo{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.card p.alvo b{color:var(--win);font-weight:600}
.rules{counter-reset:r}
.rule{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.rule i{font-family:var(--mono);font-size:11px;color:var(--amber);font-style:normal;padding-top:2px}
.rule div b{display:block;font-size:14px;margin-bottom:2px}
.rule div span{font-size:13px;color:var(--muted)}

.wform{display:flex;gap:8px;margin-bottom:12px}
.wform input{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  color:var(--bone);font-size:16px;font-weight:600;padding:12px}
.wform button{background:var(--amber);color:#1A1206;border-radius:9px;padding:0 18px;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px}
.gnum{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.gnum b{font-family:var(--disp);font-size:42px;font-weight:800;color:var(--bone);line-height:1}
.gbar{height:9px;background:var(--line);border-radius:9px;margin:12px 0 6px;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--win));width:0;transition:width .5s}

.hex{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
.hex .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hex .top b{font-size:13.5px;font-weight:600}
.hex .top span{font-family:var(--mono);font-size:11px;color:var(--win);white-space:nowrap}
.hex svg{display:block;width:100%;height:38px;margin-top:9px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 20px;
  border:1px dashed var(--line);border-radius:13px}
.danger{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--hot);
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;margin-top:8px}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:16px 0 30px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== extras do app ===== */
body{padding-bottom:calc(130px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.brand span{white-space:nowrap}
.fire{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:.25s}
.fire .fl{font-size:26px;line-height:1;filter:grayscale(1) brightness(.7);transition:.3s;display:inline-block}
.fire b{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.fire small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--muted);margin-top:1px}
.fire.wait .fl{filter:grayscale(.6) brightness(.9)}
.fire.wait b{color:var(--amber)}
.fire.wait{border-color:var(--amber-dim)}
.fire.on{border-color:var(--amber);background:linear-gradient(135deg,#3a2810,var(--surface));box-shadow:0 0 18px rgba(240,169,59,.35)}
.fire.on .fl{filter:none;animation:flick 1.3s ease-in-out infinite}
.fire.on b{color:var(--amber)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.14) rotate(3deg)}}
.stmsg{margin:10px 0 0;padding:9px 12px;border-radius:10px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);color:#D9D1E4}
.stmsg.ok{border-color:var(--win);color:var(--win)}
.stmsg.warn2{border-color:var(--hot);color:var(--hot)}
.tagp{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px;border:1px solid var(--win);color:var(--win)}
.tagp.mq{border-color:var(--muted);color:var(--muted)}
.tagp.lv{border-color:var(--amber-dim);color:var(--amber)}
.dsec.why h3{color:var(--muted)}
.dsec.pump h3{color:var(--win)}
.dsec.pump p{color:var(--bone)}
.vids{display:flex;flex-direction:column;gap:7px}
.vid{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--bone)}
.vid i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--amber);color:#1A1206;display:grid;place-items:center;font-style:normal;font-size:11px}
.vid span{min-width:0;font-size:12.5px;line-height:1.3}
.vid span em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid span b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vnote{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.prb{color:var(--amber);font-weight:700}
.concl{width:100%;margin:18px 0 4px;padding:17px;border-radius:13px;background:var(--amber);color:#1A1206;font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:.07em;display:flex;align-items:center;justify-content:center;gap:10px}
.concl.feito{background:var(--surface);border:1px solid var(--win);color:var(--win);font-size:20px}
.concl:active{transform:scale(.985)}
.undo{display:block;margin:6px auto 0;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;padding:8px;text-decoration:underline}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;z-index:90;max-width:90%;
  background:var(--amber);color:#1A1206;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;padding:10px 16px;border-radius:999px;transition:.3s;pointer-events:none;text-align:center}
.toast.up{transform:translate(-50%,0);opacity:1}
/* celebração */
.cel{position:fixed;inset:0;z-index:100;background:rgba(23,19,32,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.cel.up{display:flex}
.celin{position:relative;z-index:2;max-width:380px;width:100%;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.bigfire{font-size:104px;line-height:1.1;margin-bottom:8px;display:inline-block;animation:burn 1.1s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(240,169,59,.7))}
@keyframes burn{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}
.celnum{font-family:var(--disp);font-size:96px;font-weight:800;color:var(--amber);line-height:.9;margin-top:4px;font-variant-numeric:tabular-nums}
.cellbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:16px}
.cel h2{font-family:var(--disp);font-size:36px;font-weight:800;letter-spacing:.04em;margin:0 0 6px;line-height:1}
.cel p{margin:0 0 12px;color:#D9D1E4;font-size:14.5px}
.celx{margin:6px 0 16px;display:flex;flex-direction:column;gap:6px}
.celx div{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);color:var(--bone)}
.celx div.rec{border-color:var(--amber);color:var(--amber)}
.celx div.mk{border-color:var(--win);color:var(--win)}
.conf{position:absolute;inset:0;z-index:1;pointer-events:none}
.conf i{position:absolute;top:-14px;left:var(--x);width:9px;height:15px;background:var(--c);opacity:.95;border-radius:2px;animation:fall var(--d) linear var(--dl) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(112vh) rotate(var(--r))}}
/* sequência */
.hero{background:linear-gradient(160deg,#33240f,var(--surface));border:1px solid var(--amber-dim);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:12px}
.hero.off{background:var(--surface);border-color:var(--line)}
.hero .hf{font-size:64px;line-height:1;display:inline-block}
.hero.on .hf{animation:burn 1.1s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(240,169,59,.6))}
.hero.off .hf{filter:grayscale(1) brightness(.6)}
.hero .hn{font-family:var(--disp);font-size:84px;font-weight:800;line-height:.9;color:var(--amber)}
.hero.off .hn{color:var(--muted)}
.hero .hl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.hero p{margin:10px 0 0;font-size:13px;color:#D9D1E4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:32px;font-weight:800;line-height:1}
.stat span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.hc{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.hc.on{background:var(--amber);border-color:var(--amber)}
.hc.part{background:var(--amber-dim);border-color:var(--amber-dim)}
.hc.miss{background:var(--surface);border-color:#4a2a3a}
.hc.rest{background:transparent;border-style:dashed}
.hc.fut{background:transparent;border-color:transparent}
.hc.hj{outline:2px solid var(--bone);outline-offset:1px}
.hleg{display:flex;gap:11px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.hleg span{display:flex;align-items:center;gap:5px}
.hleg i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.hdw{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-family:var(--mono);font-size:8.5px;color:var(--muted)}
.hwrap{display:grid;grid-template-columns:16px 1fr;gap:6px}
.hdw span{display:grid;place-items:center}
/* evolução */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1A1206}
.evx{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.evx.pr{border-color:var(--amber-dim)}
.evx .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.evx .top b{font-size:13.5px;font-weight:600}
.evx .badge{font-family:var(--mono);font-size:10px;font-weight:700;color:#1A1206;background:var(--amber);border-radius:999px;padding:3px 8px;white-space:nowrap}
.evx .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.evx .sub b{color:var(--win);font-weight:600}
.evx svg{display:block;width:100%;height:auto;margin-top:8px}
.evx .inc{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.evx .inc div{display:flex;justify-content:space-between;padding:2px 0}
.evx .inc div b{color:var(--win);font-weight:600}
.recl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.recl:first-child{border-top:0}
.recl span{font-family:var(--mono);font-size:11px;color:var(--amber);white-space:nowrap}
.vbar{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;padding:4px 0}
.vbar u{text-decoration:none;width:78px;color:var(--muted)}
.vbar div{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.vbar div i{display:block;height:100%;background:var(--amber)}
.vbar b{width:26px;text-align:right}
.btn2{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;margin-top:8px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.fire.on .fl,.bigfire,.hero.on .hf{animation:none!important}.conf{display:none}}

/* ============ armazenamento (localStorage com fallback em memória) ============ */
const Store=(()=>{
  let ok=true,mem={};
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){ok=false}
  return{
    get(k,d){try{const v=ok?localStorage.getItem(k):mem[k];return v?JSON.parse(v):d}catch(e){return d}},
    set(k,v){try{const s=JSON.stringify(v);ok?localStorage.setItem(k,s):mem[k]=s}catch(e){mem[k]=JSON.stringify(v)}},
    del(k){try{ok?localStorage.removeItem(k):delete mem[k]}catch(e){}}
  }
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

const pad=n=>String(n).padStart(2,'0');

const hoje=()=>ds(new Date());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>parse(s).getDay(); /* 0 = domingo */
/* Regras da sequência:
   - concluir o treino do dia soma 1;
   - domingo é descanso: não conta e NÃO quebra;
   - faltar a um dia de treino (seg a sáb) zera a sequência;
   - o dia de hoje ainda sem treino não quebra nada (ainda dá tempo). */
function calcStreak(done,today){
  const keys=Object.keys(done).sort();
  if(!keys.length)return{cur:0,best:0,hojeFeito:false};
  const min=keys[0];
  const hojeFeito=!!done[today];
  let cur=0,d=hojeFeito?today:addD(today,-1);
  while(d>=min){
    if(done[d])cur++;
    else if(dow(d)!==0)break;
    d=addD(d,-1);
  }
  let best=0,run=0;d=min;
  while(d<=today){
    if(done[d]){run++;if(run>best)best=run}
    else if(dow(d)===0||d===today){}
    else run=0;
    d=addD(d,1);
  }
  return{cur,best,hojeFeito};
}

    const sets=Object.values(ex).filter(s=>s.ok&&num(s.kg)>0);
    if(!sets.length)return;
    let kg=0,reps=0,rm=0,vol=0;
    sets.forEach(s=>{const k=num(s.kg),r=num(s.reps)||1;vol+=k*r;if(k>kg||(k===kg&&r>reps)){kg=k;reps=r}const e=rm1(k,r);if(e>rm)rm=e});
    out.push({d,kg,reps,rm,vol});
  });
  let mk=0,mr=0,prev=null;
  out.forEach((o,i)=>{
    o.prKg=i>0&&o.kg>mk;o.prRm=i>0&&o.rm>mr+0.001;o.pr=o.prKg||o.prRm;
    o.up=prev?o.kg>prev.kg:false;o.de=prev?prev.kg:0;
    mk=Math.max(mk,o.kg);mr=Math.max(mr,o.rm);prev=o;
  });
  return out;
}
function setPR(id,s,d){
  const ant=sessoes(id,d);if(!ant.length||!s.ok)return false;
  const k=num(s.kg);if(!k)return false;
  const mk=Math.max(...ant.map(x=>x.kg)),mr=Math.max(...ant.map(x=>x.rm));
  return k>mk||rm1(k,num(s.reps)||1)>mr+0.001;
}
function acharEx(id){for(const k in PLANO){const e=PLANO[k].ex.find(x=>x.id===id);if(e)return e}}
function prsDoDia(d){
  const out=[];
  Object.keys(LOG[d]||{}).forEach(id=>{
    const e=acharEx(id);if(!e)return;
    const ss=sessoes(id),s=ss.find(x=>x.d===d);
    if(s&&s.pr)out.push({n:e.n,kg:s.kg,reps:s.reps});
  });
  return out;
}
function todosPRs(){
  const out=[];
  for(const k in PLANO)PLANO[k].ex.forEach(e=>sessoes(e.id).forEach(s=>{if(s.pr)out.push({d:s.d,n:e.n,kg:s.kg,reps:s.reps,id:e.id})}));
  return out.sort((a,b)=>a.d<b.d?1:-1);
}

/* ============ sequência ============ */
function streakNow(){
  const s=calcStreak(DONE,hoje());
  if(s.best>BEST){BEST=s.best;Store.set('ficha.best',BEST)}
  if(s.cur>0){if(LS.n!==s.cur){LS={n:s.cur};Store.set('ficha.ls',LS)}if(QUEBRA){QUEBRA=null;Store.del('ficha.quebra')}}
  else if(LS.n>0){QUEBRA={n:LS.n};Store.set('ficha.quebra',QUEBRA);LS={n:0};Store.set('ficha.ls',LS)}
  s.melhor=BEST;return s;
}
function statusMsg(s){
  if(s.hojeFeito)return['ok','Treino de hoje concluído. Sequência de '+s.cur+(s.cur===1?' dia':' dias')+' 🔥'];
  if(diaHoje()==='dom'&&s.cur>0)return['ok','Domingo é descanso. Sua sequência de '+s.cur+' dias está segura 🔥'];
  if(QUEBRA&&s.cur===0)return['warn2','Sequência de '+QUEBRA.n+' dias encerrada. Hoje começa uma nova, bora!'];
  if(s.cur>0)return['','Conclua o treino de hoje para manter sua sequência de '+s.cur+(s.cur===1?' dia':' dias')+'.'];
  return['','Conclua o treino de hoje para acender o foguinho 🔥'];
}
function totais(d,D){
  let feitas=0,total=0;
  D.ex.forEach(e=>{total+=e.s;for(let i=0;i<e.s;i++)if(pega(d,e.id,i).ok)feitas++});
  return{feitas,total};
}
function concluir(auto){
  const d=hoje();if(DONE[d])return;
  const D=PLANO[view];if(!D)return;
  const t=totais(d,D);
  if(!auto&&t.feitas===0){toast('Marque pelo menos uma série primeiro');return}
  if(!auto&&t.feitas<t.total&&!confirm('Faltam '+(t.total-t.feitas)+' séries. Concluir o treino mesmo assim?'))return;
  const antes=BEST;
  DONE[d]={dia:view,s:t.feitas,t:Date.now()};salvaDone();
  const s=streakNow();
  celebra(s,s.cur>1&&s.cur>antes,prsDoDia(d),t);
  render();
}
function desfazer(){
  if(!confirm('Desfazer a conclusão do treino de hoje? A sequência volta ao valor anterior.'))return;
  delete DONE[hoje()];salvaDone();render();
}
const MARCOS=[3,7,14,21,30,50,75,100,150,200,365];
function celebra(s,novoRec,prs,t){
  const n=s.cur;
  const frases=[
    'Você não perdeu nenhum dia, continue na sua sequência!',
    'Mais um dia no bolso. Quem é consistente, cresce.',
    'O foguinho não apaga! Amanhã tem mais.',
    'Sequência viva. Ninguém te segura!'];
  const msg=n<=1?'Foguinho aceso! Primeiro dia da sequência: não pare agora.':frases[n%frases.length];
  document.getElementById('celnum').textContent=Math.max(n-1,0);
  document.getElementById('celtit').textContent=n<=1?'FOGUINHO ACESO':'TREINO CONCLUÍDO';
  document.getElementById('celmsg').textContent=msg;
  let x='<div>'+t.feitas+' / '+t.total+' séries · '+(PLANO[view]?PLANO[view].nome:'')+'</div>';
  if(MARCOS.includes(n))x+='<div class="mk">🏅 MARCO: '+n+' DIAS SEGUIDOS</div>';
  if(novoRec)x+='<div class="rec">🏆 NOVA MELHOR SEQUÊNCIA: '+n+' DIAS</div>';
  prs.slice(0,6).forEach(p=>{x+='<div class="rec">🏆 RECORDE · '+esc(p.n)+' · '+fmt(p.kg)+' kg × '+p.reps+'</div>'});
  document.getElementById('celx').innerHTML=x;
  const c=document.getElementById('conf');const cores=['#F0A93B','#FF5C8A','#5FD3A6','#F4EFE6','#7A5620'];
  c.innerHTML=Array.from({length:44},(_,i)=>`<i style="--x:${Math.random()*100}%;--c:${cores[i%5]};--d:${2.2+Math.random()*2}s;--dl:${Math.random()*.8}s;--r:${Math.round(Math.random()*900-450)}deg"></i>`).join('');
  document.getElementById('cel').classList.add('up');
  if(navigator.vibrate)navigator.vibrate([60,40,60,40,180]);
  const el=document.getElementById('celnum');const a=Math.max(n-1,0),t0=performance.now();
  (function step(now){const p=Math.min((now-t0-450)/700,1);if(p>=1){el.textContent=n;return}el.textContent=p<0?a:Math.round(a+(n-a)*p);requestAnimationFrame(step)})(t0);
}
function closeCel(){document.getElementById('cel').classList.remove('up')}
let toastT=null;
function toast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('up');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('up'),2600);
}

/* ============ render ============ */
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){

    DIAS.map(([k,l])=>`<button class="day ${view===k?'on':''} ${diaHoje()===k?'hoje':''}" onclick="go('${k}')">${l}</button>`).join('')
    +`<button class="day util ${view==='seq'?'on':''}" onclick="go('seq')">🔥 Sequência</button>`
    +`<button class="day util ${view==='evo'?'on':''}" onclick="go('evo')">Evolução</button>`
    +`<button class="day util ${view==='guia'?'on':''}" onclick="go('guia')">Guia</button>`;

      <div class="dsec warn"><h3>ATENÇÃO</h3><p>${e.erro}</p></div>
      <div class="dsec"><h3>VÍDEOS</h3><div class="vids">${e.v.map(vidLink).join('')}</div>

function marcar(d,ex,i,rest){

    const D=PLANO[view];

function tickRest(){

/* ============ metrônomo de tempo ============ */
let mEx=null,mT=null,mFase=0,mLeft=0,mRep=0,mRun=false;
const CIRC=2*Math.PI*54;
function openMet(id){
  mEx=acharEx(id);mFase=0;mRep=0;mLeft=0;mRun=false;clearInterval(mT);
  document.getElementById('mname').textContent=mEx.n;
  document.getElementById('mplan').textContent=mEx.t.map(x=>x.f+' '+x.s+'s').join('  ·  ');
  document.getElementById('mphase').textContent='PRONTA?';
  document.getElementById('mcount').textContent='—';
  document.getElementById('mreps').textContent='REPETIÇÃO 0';
  document.getElementById('mtoggle').textContent='COMEÇAR';
  const f=document.getElementById('rfill');
  f.style.strokeDasharray=CIRC;f.style.strokeDashoffset=0;
  document.getElementById('met').classList.add('up');
}
function closeMet(){mRun=false;clearInterval(mT);document.getElementById('met').classList.remove('up')}
function toggleMet(){
  if(mRun){mRun=false;clearInterval(mT);document.getElementById('mtoggle').textContent='CONTINUAR';return}
  mRun=true;document.getElementById('mtoggle').textContent='PAUSAR';
  if(mLeft<=0){mFase=0;mLeft=mEx.t[0].s;mRep=1;pintaFase()}
  clearInterval(mT);
  mT=setInterval(()=>{
    mLeft-=0.1;
    if(mLeft<=0){
      mFase++;
      if(mFase>=mEx.t.length){mFase=0;mRep++;if(navigator.vibrate)navigator.vibrate([25,40,25])}
      else if(navigator.vibrate)navigator.vibrate(22);
      mLeft=mEx.t[mFase].s;pintaFase();
    }
    pintaTempo();
  },100);
  pintaFase();pintaTempo();
}
function pintaFase(){
  const f=mEx.t[mFase];
  document.getElementById('mphase').textContent=f.f;
  document.getElementById('mreps').textContent='REPETIÇÃO '+mRep;
  const cor=['SEGURA','APERTA','PAUSA','ALONGA'].includes(f.f)?'var(--win)':
            ['DESCE','FECHA','VOLTA','ABRE'].includes(f.f)?'var(--hot)':'var(--amber)';
  document.getElementById('rfill').style.stroke=cor;
  document.getElementById('mcount').style.color=cor;
}
function pintaTempo(){
  const tot=mEx.t[mFase].s;
  document.getElementById('mcount').textContent=Math.max(mLeft,0).toFixed(1);
  document.getElementById('rfill').style.strokeDashoffset=CIRC*(1-Math.max(mLeft,0)/tot);
}

/* ============ sequência: tela, calendário ============ */

  const dw=(dow(hoj)+6)%7;
  const seg=addD(hoj,-dw);
  const ini=addD(seg,-(semanas-1)*7);
  let cells='';
  for(let i=0;i<semanas*7;i++){
    const d=addD(ini,i);
    const sunday=dow(d)===0;
    const temLog=LOG[d]&&Object.values(LOG[d]).some(ex=>Object.values(ex).some(x=>x.ok));
    let c='hc';
    if(d>hoj)c+=' fut';
    else if(DONE[d])c+=' on';
    else if(temLog)c+=' part';
    else if(sunday)c+=' rest';
    else if(d<hoj)c+=' miss';
    if(d===hoj)c+=' hj';
    cells+=`<div class="${c}" title="${d}"></div>`;
  }
  const keys=Object.keys(DONE);
  const series=keys.reduce((a,k)=>a+(DONE[k].s||0),0);
  const prs=todosPRs().length;

   <div class="hero ${s.cur>0?'on':'off'}"><div class="hf">🔥</div><div class="hn">${s.cur}</div><div class="hl">${s.cur===1?'DIA':'DIAS'} SEGUIDOS</div><p>${sm[1]}</p></div>
   <div class="stats">
     <div class="stat"><b>${s.melhor}</b><span>MELHOR SEQUÊNCIA</span></div>
     <div class="stat"><b>${keys.length}</b><span>TREINOS</span></div>
     <div class="stat"><b>${prs}</b><span>RECORDES 🏆</span></div>
   </div>
   <div class="stats"><div class="stat"><b>${series}</b><span>SÉRIES FEITAS</span></div>
     <div class="stat"><b>${on?'✓':'—'}</b><span>HOJE</span></div>
     <div class="stat"><b>${diaHoje()==='dom'?'DESC.':(PLANO[diaHoje()]||{nome:''}).nome.slice(0,3)}</b><span>TREINO DE HOJE</span></div></div>
   <h2 style="font-family:var(--disp);font-size:24px;font-weight:800;margin:20px 0 8px">CALENDÁRIO · ${semanas} SEMANAS</h2>
   <div class="card"><div class="hwrap"><div class="hdw"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div><div class="heat">${cells}</div></div>
   <div class="hleg"><span><i style="background:var(--amber)"></i>treinou</span><span><i style="background:var(--amber-dim)"></i>parcial</span><span><i style="background:var(--surface);border-color:#4a2a3a"></i>faltou</span><span><i style="border-style:dashed"></i>domingo</span></div></div>
   <h2 style="font-family:var(--disp);font-size:24px;font-weight:800;margin:20px 0 8px">BACKUP</h2>
   <div class="card"><p>Tudo fica salvo só neste aparelho. Antes de trocar de celular ou limpar dados do Safari, copie o backup e guarde numa nota.</p>
   <button class="btn2" onclick="exportBkp()">COPIAR BACKUP</button><button class="btn2" onclick="importBkp()">RESTAURAR BACKUP</button>
   <button class="danger" onclick="apagaTudo()">APAGAR TODOS OS DADOS</button></div></div>`;
}
function exportBkp(){
  const j=JSON.stringify({v:1,log:LOG,done:DONE,best:BEST});
  const ok=()=>toast('Backup copiado');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(j).then(ok,()=>prompt('Copie o backup:',j))}
  else prompt('Copie o backup:',j);
}
function importBkp(){
  const t=prompt('Cole aqui o backup copiado:');if(!t)return;
  try{
    const o=JSON.parse(t);if(!o||typeof o.log!=='object'||typeof o.done!=='object')throw 0;
    if(!confirm('Isso substitui todos os dados atuais. Continuar?'))return;
    LOG=o.log;DONE=o.done;BEST=o.best||0;salvaLog();salvaDone();Store.set('ficha.best',BEST);LS={n:0};Store.set('ficha.ls',LS);render();toast('Backup restaurado');
  }catch(e){alert('Backup inválido.')}
}
function apagaTudo(){
  if(!confirm('Apagar todo o histórico, recordes e sequência? Não tem como desfazer.'))return;
  ['ficha.log','ficha.done','ficha.best','ficha.ls','ficha.quebra'].forEach(k=>Store.del(k));
  LOG={};DONE={};BEST=0;LS={n:0};QUEBRA=null;render();
}

/* ============ evolução ============ */
function grafico(ss,met){
  const W=300,H=96,px=26,py=12;
  const val=s=>met==='kg'?s.kg:met==='rm'?s.rm:s.vol;
  const vs=ss.map(val);
  const mx=Math.max(...vs),mn=Math.min(...vs);
  const rng=mx-mn||1;
  const X=i=>ss.length>1?px+i/(ss.length-1)*(W-px-8):(W+px)/2;
  const Y=v=>mx===mn?H/2:H-py-((v-mn)/rng)*(H-2*py);
  const pts=ss.map((s,i)=>X(i)+','+Y(val(s))).join(' ');
  const un=met==='vol'?'':' kg';
  const f=v=>met==='vol'?Math.round(v):fmt(v);
  return `<svg viewBox="0 0 ${W} ${H+14}" role="img" aria-label="gráfico de evolução">
    <line x1="${px}" y1="${py}" x2="${W-8}" y2="${py}" stroke="#372C48" stroke-width=".6" stroke-dasharray="2 3"/>
    <line x1="${px}" y1="${H-py}" x2="${W-8}" y2="${H-py}" stroke="#372C48" stroke-width=".6" stroke-dasharray="2 3"/>
    <text x="1" y="${py+3}" fill="#9A8CAC" font-size="7" font-family="monospace">${f(mx)}</text>
    <text x="1" y="${H-py+3}" fill="#9A8CAC" font-size="7" font-family="monospace">${f(mn)}</text>
    <polyline points="${pts}" fill="none" stroke="#F0A93B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${ss.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(val(s))}" r="${s.pr?4:2.4}" fill="${s.pr?'#F0A93B':'#F4EFE6'}" ${s.pr?'stroke="#171320" stroke-width="1.2"':''}/>`).join('')}
    <text x="${px}" y="${H+10}" fill="#9A8CAC" font-size="7" font-family="monospace">${dm(ss[0].d)}</text>
    <text x="${W-8}" y="${H+10}" fill="#9A8CAC" font-size="7" font-family="monospace" text-anchor="end">${dm(ss[ss.length-1].d)}</text>
  </svg>`;
}
function viewEvo(){
  const exs=[];
  for(const k in PLANO)if(evDia==='todos'||evDia===k)PLANO[k].ex.forEach(e=>{if(e.id!=='u_giga')exs.push({e,dia:k,ss:sessoes(e.id)})});
  const comDados=exs.filter(x=>x.ss.length>0);
  const prsAll=todosPRs();
  const metL={kg:'CARGA (KG)',rm:'1RM ESTIMADO',vol:'VOLUME'};
  const chipsD=`<div class="chips"><button class="chip ${evDia==='todos'?'on':''}" onclick="evDia='todos';render()">TODOS</button>`+DIAS.map(([k,l])=>`<button class="chip ${evDia===k?'on':''}" onclick="evDia='${k}';render()">${l}</button>`).join('')+'</div>';
  const chipsM=`<div class="chips">`+Object.keys(metL).map(k=>`<button class="chip ${evMet===k?'on':''}" onclick="evMet='${k}';render()">${metL[k]}</button>`).join('')+'</div>';
  let h=`<div class="gsec"><h2>EVOLUÇÃO</h2><p>Cada série marcada com carga entra aqui. A linha precisa subir; o ponto dourado é recorde.</p>
    <div class="stats"><div class="stat"><b>${prsAll.length}</b><span>RECORDES 🏆</span></div>
    <div class="stat"><b>${comDados.reduce((a,x)=>a+x.ss.filter(s=>s.up).length,0)}</b><span>AUMENTOS DE CARGA</span></div>
    <div class="stat"><b>${comDados.length}</b><span>EXERCÍCIOS</span></div></div>`;
  if(prsAll.length){
    h+=`<div class="card hi"><h4><em>RECENTES</em>Últimos recordes</h4>`+prsAll.slice(0,6).map(p=>`<div class="recl"><div>🏆 ${esc(p.n)}</div><span>${fmt(p.kg)} kg × ${p.reps} · ${dm(p.d)}</span></div>`).join('')+'</div>';
  }
  h+=chipsD+chipsM;
  if(!comDados.length){
    h+=`<div class="empty">Nada registrado${evDia==='todos'?' ainda':' neste dia'}.<br>Marque séries com carga no treino e o gráfico de cada exercício aparece aqui.</div>`;
  }else{
    h+=comDados.map(({e,ss})=>{
      const prN=ss.filter(s=>s.pr).length;
      const ult=ss[ss.length-1],pri=ss[0];
      const dif=ult.kg-pri.kg;
      const incs=ss.filter(s=>s.up).slice(-5).reverse();
      return `<div class="evx ${prN?'pr':''}"><div class="top"><b>${e.n}</b>${prN?`<span class="badge">🏆 ${prN} PR</span>`:''}</div>
       <div class="sub">MELHOR <b>${fmt(Math.max(...ss.map(s=>s.kg)))} kg</b> · 1RM EST. <b>${fmt(Math.max(...ss.map(s=>s.rm)))} kg</b> · ${ss.length} ${ss.length===1?'SESSÃO':'SESSÕES'} · ${dif>0?'+':''}${fmt(dif)} kg desde o início</div>
       ${grafico(ss,evMet)}
       ${incs.length?`<div class="inc">${incs.map(s=>`<div><span>${dm(s.d)} · aumentou a carga</span><b>${fmt(s.de)} → ${fmt(s.kg)} kg (+${fmt(s.kg-s.de)})</b></div>`).join('')}</div>`:''}
      </div>`;
    }).join('');
  }
  return h+'</div>';
}

/* ============ guia ============ */
const REGRAS=[
 ['Cabo primeiro, máquina só quando precisa','Todo exercício leva a etiqueta POLIA, MÁQUINA ou LIVRE. Máquina ou halter só entram onde não existe versão em cabo com a mesma sobrecarga ou posição (abdutora, hack, extensora, flexora sentada, panturrilha pesada).'],
 ['Chegar perto da falha','Compostos param com 1–2 reps na reserva. Isoladores: a última série (etiqueta ÚLT. À FALHA) vai até a falha real.'],
 ['Bater o número anterior','Cada série mostra o resultado da última sessão. Superar aquele número é o objetivo e gera recorde.'],
 ['Descansar de verdade','2 a 3 min nos compostos, 60 s a 2 min nos isoladores. O cronômetro dispara sozinho ao marcar a série.'],
 ['Excêntrica de 3 a 4 segundos','A fase de descida é onde o músculo mais cresce. Use o GUIAR TEMPO em cada exercício.'],
 ['Pausa na contração','1 a 2 segundos apertando no pico dos isoladores.'],
 ['Amplitude completa','O maior crescimento vem da posição alongada. Meia amplitude corta justamente ela.'],
 ['Sono e comida','Volume alto só funciona com recuperação. Dormir 7 a 9 h e comer proteína suficiente decidem o resultado.']
];
const TECS=[
 ['Drop set','Na falha, tira 25–30% da carga e continua sem descanso. 1 a 2 quedas, só na última série.'],
 ['Rest-pause','Vai à falha, descansa 15 s, faz mais reps até a falha, descansa 15 s e repete mais uma vez.'],
 ['Parciais no alongamento','Ao chegar na falha, continua com reps curtas só na metade alongada do movimento.'],
 ['Pausa isométrica','2 s parada na contração máxima. Dói mais e usa menos carga, que é justamente o ponto.'],
 ['Giga série','Três exercícios do mesmo músculo sem descanso. Entra como finalizador da quinta.']
];
function viewGuia(){
  const vol={};
  for(const k in PLANO)PLANO[k].ex.forEach(e=>{vol[e.m]=(vol[e.m]||0)+e.s});
  const mx=Math.max(...Object.values(vol));
  let polia=0,tot=0;
  for(const k in PLANO)PLANO[k].ex.forEach(e=>{tot+=e.s;if(e.tp==='POLIA')polia+=e.s});
  return `<div class="gsec"><h2>AS REGRAS</h2><p>Valem para todos os exercícios da ficha.</p>
    <div class="card rules">${REGRAS.map((r,i)=>`<div class="rule"><i>${String(i+1).padStart(2,'0')}</i><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join('')}</div></div>
   <div class="gsec"><h2>VOLUME SEMANAL</h2><p>Séries diretas por grupo na semana. Glúteo e quadríceps aparecem em 3 dias cada; posterior e panturrilha em 2 a 3.</p>
    <div class="card">${Object.keys(vol).sort((a,b)=>vol[b]-vol[a]).map(m=>`<div class="vbar"><u>${m.toUpperCase()}</u><div><i style="width:${vol[m]/mx*100}%"></i></div><b>${vol[m]}</b></div>`).join('')}
    <p class="alvo" style="margin-top:8px">${Math.round(polia/tot*100)}% DAS SÉRIES SÃO NA <b>POLIA</b> · ${tot} SÉRIES NA SEMANA</p></div>
    <div class="card"><p>É volume alto, pensado para uma atleta avançada. Se na primeira semana a recuperação ficar ruim, tira 1 série de cada exercício composto antes de mexer em qualquer outra coisa.</p></div></div>
   <div class="gsec"><h2>TÉCNICAS DE PUMP</h2><p>Só na última série do exercício marcado.</p>
    ${TECS.map(t=>`<div class="card"><h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('')}</div>
   <div class="gsec"><h2>CADEIRA ABDUTORA</h2><p>A exceção pedida: máquina, não polia.</p>
    <div class="card hi"><h4><em>NA QUINTA</em>Pontinha do banco, tronco ~45°</h4><p>Senta na beirada da frente, inclina o tronco ~45° à frente com a coluna reta, segura as alças só para travar o tronco e roda joelhos e pés para fora. Abre em 2 s, segura 2 s, fecha em 3 s sem encostar as placas. A ênfase é no glúteo médio e no pump.</p></div></div>
   <div class="gsec"><h2>PROGRESSÃO</h2><p>Dupla progressão, o motor de tudo.</p>
    <div class="card"><p>Num exercício de <b>4 × 8–12</b> a faixa é uma janela. Quando fechar <b>12 repetições em todas as séries</b> com técnica limpa, sobe 2,5 kg e as reps caem para 8–9. A aba Evolução mostra cada aumento de carga e cada recorde.</p></div></div>
   <p class="note">Plano baseado em princípios gerais de hipertrofia. Vale validar a execução do stiff, do hack e do búlgaro com um profissional presencialmente. Os vídeos são de terceiros no YouTube, abrem fora do app e precisam de internet.</p>`;
}
